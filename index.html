<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fog Smart Campus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Fog-Based Smart Campus Monitoring</h1><p>Local processing • Low latency • IoT monitoring</p></header>
<main>
<section class="grid">
<div class="card"><span>Temperature</span><strong id="temperature">-- °C</strong></div>
<div class="card"><span>Humidity</span><strong id="humidity">-- %</strong></div>
<div class="card"><span>Occupancy</span><strong id="occupancy">--</strong></div>
<div class="card"><span>Air Quality</span><strong id="air">--</strong></div>
</section>
<section class="panel">
<h2>Fog Node Status</h2>
<p id="fog">● ONLINE / LOCAL PROCESSING</p>
</section>
<section class="panel">
<h2>Recent Alert</h2>
<p id="alert">No alerts</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
